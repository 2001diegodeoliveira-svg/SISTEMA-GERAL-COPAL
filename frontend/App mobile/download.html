<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download App COPAL SESP Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f3f6fb; font-family:'Inter',sans-serif; color:#1f2937; }
  .container{ width:min(480px,100%); background:#fff; border-radius:24px; box-shadow:0 24px 80px rgba(15,23,42,0.12); padding:32px; text-align:center; }
  h1{ margin:0 0 16px; font-size:24px; font-weight:800; }
  p{ margin:0 0 24px; color:#475569; line-height:1.6; }
  .button{ display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; background:#1d4ed8; color:#fff; padding:14px 20px; border-radius:999px; font-weight:700; box-shadow:0 12px 24px rgba(30,64,175,0.18); }
  .button:hover{ background:#1e40af; }
  .note{ margin-top:18px; color:#0f766e; font-size:13px; }
  .qr{ width:170px; height:170px; margin:4px auto 22px; display:block; border-radius:14px; border:1px solid #dbeafe; }
</style>
</head>
<body>
  <div class="container">
    <h1>Baixar App COPAL SESP</h1>
    <p>Abra este link no celular para acessar a versão mobile de consulta de contratos cadastrados no sistema COPAL SESP.</p>
    <img class="qr" id="downloadQr" alt="QR Code do aplicativo COPAL SESP">
    <a href="copal-sesp-mobile.html" class="button">Abrir App Mobile</a>
    <p class="note">Aplicativo web somente para visualização. Não permite editar ou excluir dados.</p>
  </div>
  <script>
    const appUrl = window.location.protocol === 'file:' ? 'https://sistema-geral-copal.vercel.app/frontend/App%20mobile/copal-sesp-mobile.html' : `${window.location.origin}/frontend/App%20mobile/copal-sesp-mobile.html`;
    document.getElementById('downloadQr').src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(appUrl)}`;
  </script>
</body>
</html>
