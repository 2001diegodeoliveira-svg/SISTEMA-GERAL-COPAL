<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SGC - Monitoria de Contratos | SESP-MT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg: #0a0f1e;
            --bg-soft: #0f172a;
            --surface: #141e36;
            --surface-2: #1b2741;
            --line: rgba(148, 163, 184, 0.16);
            --line-strong: rgba(148, 163, 184, 0.28);
            --text: #e6edf7;
            --muted: #8aa0bd;
            --brand: #3b82f6;
            --cyan: #22d3ee;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --violet: #a78bfa;
            --radius: 16px;
            --shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            min-height: 100vh;
            background-color: var(--bg);
            background-image:
                radial-gradient(900px 420px at 82% -8%, rgba(34, 211, 238, 0.09), transparent 60%),
                radial-gradient(760px 400px at 8% 0%, rgba(59, 130, 246, 0.1), transparent 55%);
            background-attachment: fixed;
            color: var(--text);
            overflow: hidden;
        }

        .sidebar {
            width: 256px;
            min-width: 256px;
            height: 100vh;
            background: linear-gradient(180deg, #0c1427 0%, #0a0f1e 100%);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            min-height: 76px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            border-bottom: 1px solid var(--line);
        }

        .sidebar-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.35), rgba(34, 211, 238, 0.25));
            border: 1px solid rgba(34, 211, 238, 0.35);
            color: var(--cyan);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.25);
        }

        .sidebar-header h2 {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.1;
            color: #fff;
        }

        .sidebar-header span {
            font-size: 11px;
            color: var(--muted);
        }

        .nav-menu {
            list-style: none;
            padding: 14px 10px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            margin-bottom: 4px;
            border-radius: 12px;
            color: var(--muted);
            cursor: pointer;
            transition: 0.18s;
            font-size: 13.5px;
            font-weight: 600;
            position: relative;
        }

        .nav-item svg {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.12);
            color: var(--text);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.22), rgba(34, 211, 238, 0.08));
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35);
        }

        .nav-item.active::before {
            content: "";
            position: absolute;
            left: -10px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 3px;
            background: linear-gradient(var(--brand), var(--cyan));
        }

        .sidebar-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--line);
            font-size: 11px;
            color: var(--muted);
        }

        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            min-height: 76px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
        }

        .topbar-titles h1 {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }

        .topbar-titles p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.06);
        }

        .topbar-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--brand), var(--cyan));
            color: #08111f;
        }

        .topbar-user small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-user strong {
            font-size: 12.5px;
            color: #fff;
            display: block;
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 26px 28px 40px;
            scrollbar-width: thin;
            scrollbar-color: var(--line-strong) transparent;
        }

        .content-area::-webkit-scrollbar {
            width: 9px;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 8px;
        }

        .card {
            background: linear-gradient(160deg, rgba(27, 39, 65, 0.72), rgba(15, 23, 42, 0.85));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 22px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .card-title svg {
            width: 16px;
            height: 16px;
            color: var(--cyan);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
            margin-bottom: 22px;
        }

        .kpi-card {
            background: linear-gradient(160deg, rgba(27, 39, 65, 0.72), rgba(15, 23, 42, 0.85));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: 0.18s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            border-color: var(--line-strong);
        }

        .kpi-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--brand), var(--cyan));
            opacity: 0.7;
        }

        .kpi-card.warning::after {
            background: linear-gradient(90deg, var(--warning), #fdba74);
        }

        .kpi-card.success::after {
            background: linear-gradient(90deg, var(--success), #a7f3d0);
        }

        .kpi-card.danger::after {
            background: linear-gradient(90deg, var(--danger), #fca5a5);
        }

        .kpi-top,
        .kpi-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .kpi-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .kpi-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: rgba(59, 130, 246, 0.14);
            color: var(--cyan);
            flex-shrink: 0;
        }

        .kpi-icon svg {
            width: 18px;
            height: 18px;
        }

        .kpi-value {
            font-size: 25px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.4px;
        }

        .kpi-sub {
            font-size: 11.5px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kpi-bar {
            height: 5px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            overflow: hidden;
        }

        .kpi-bar i {
            display: block;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--brand), var(--cyan));
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 22px;
            margin-bottom: 22px;
        }

        .chart-box {
            height: 280px;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 11px 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(148, 163, 184, 0.05);
        }

        th:first-child {
            border-radius: 10px 0 0 0;
        }

        th:last-child {
            border-radius: 0 10px 0 0;
        }

        td {
            padding: 14px;
            font-size: 13px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
            color: var(--text);
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: rgba(59, 130, 246, 0.07);
        }

        tr.hidden {
            display: none;
        }

        .progress-container {
            width: 100%;
            background: rgba(148, 163, 184, 0.14);
            height: 6px;
            border-radius: 999px;
            margin-top: 7px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--brand), var(--cyan));
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--muted);
            font-weight: 600;
            gap: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge svg {
            width: 12px;
            height: 12px;
        }

        .badge.ativo {
            background: rgba(52, 211, 153, 0.14);
            color: #6ee7b7;
            border: 1px solid rgba(52, 211, 153, 0.28);
        }

        .badge.vencendo {
            background: rgba(251, 191, 36, 0.14);
            color: #fcd34d;
            border: 1px solid rgba(251, 191, 36, 0.28);
        }

        .badge.encerrado {
            background: rgba(248, 113, 113, 0.14);
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.28);
        }

        .form-control {
            padding: 10px 14px;
            background: rgba(9, 15, 30, 0.7);
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 13.5px;
            width: 100%;
            outline: none;
            color: #fff;
            transition: border-color 0.15s;
        }

        .form-control:focus {
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border: none;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.18s;
            font-family: inherit;
        }

        .btn svg {
            width: 15px;
            height: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brand), var(--cyan));
            color: #08111f;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.14);
            color: #fff;
            border: 1px solid var(--line);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.24);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
        }

        .btn-ghost:hover {
            color: #fff;
            border-color: var(--line-strong);
        }

        .empty-state,
        .loading-state {
            border: 1px dashed var(--line-strong);
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.02);
            font-size: 13.5px;
        }

        .empty-state svg,
        .loading-state svg {
            width: 30px;
            height: 30px;
            margin-bottom: 8px;
            color: var(--line-strong);
        }

        .summary-note {
            color: var(--muted);
            font-size: 12px;
        }

        .contract-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .contract-details-block {
            border: 1px solid var(--line);
            background: rgba(148, 163, 184, 0.05);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 12.5px;
            line-height: 1.55;
            word-break: break-word;
        }

        .contract-details-block strong {
            display: block;
            color: var(--muted);
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .details-scroll {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .contract-details-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--muted);
            margin: 14px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .contract-details-title svg {
            width: 14px;
            height: 14px;
            color: var(--cyan);
        }

        .form-blue {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-blue h3 {
            white-space: nowrap;
            font-size: 12.5px;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .contracts-filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 240px;
            max-width: 440px;
            position: relative;
        }

        .contracts-filter-row svg {
            position: absolute;
            left: 12px;
            width: 16px;
            height: 16px;
            color: var(--muted);
            pointer-events: none;
        }

        .contracts-filter-row input {
            padding-left: 36px;
        }

        .search-hero {
            text-align: center;
            padding: 36px 20px;
        }

        .search-hero h2 {
            font-size: 19px;
            color: #fff;
            margin-bottom: 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 720px;
            margin: 16px auto 0;
            flex-wrap: wrap;
            position: relative;
        }

        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 17px;
            height: 17px;
            color: var(--muted);
            pointer-events: none;
        }

        .search-box input {
            flex: 1;
            min-width: 260px;
            padding: 13px 14px 13px 40px;
            font-size: 14.5px;
        }

        @media (max-width: 1100px) {
            body {
                display: block;
                overflow: auto;
                height: auto;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--line);
                max-height: 30vh;
            }

            .sidebar-footer {
                display: none;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .topbar {
                padding: 16px 18px;
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .topbar-right .topbar-user {
                display: none;
            }

            .content-area {
                padding: 18px;
            }

            .kpi-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i data-lucide="shield-check"></i></div>
            <div>
                <h2>SESP-MT</h2>
                <span>Monitoria de Contratos</span>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item" onclick="window.location.href = resolveFrontendPath('painel.html.html')" data-view="painel"><i data-lucide="home"></i> Painel</li>
            <li class="nav-item active" data-view="dashboard" onclick="app.navigate('dashboard', this)"><i data-lucide="layout-dashboard"></i> Dashboard Executivo</li>
            <li class="nav-item" data-view="unidades" onclick="app.navigate('unidades', this)"><i data-lucide="building-2"></i> Painel de Unidades</li>
            <li class="nav-item" data-view="busca" onclick="app.navigate('busca', this)"><i data-lucide="search"></i> Busca Inteligente</li>
        </ul>
        <div class="sidebar-footer">
            <i data-lucide="lock" style="width:12px;height:12px;margin-right:4px;"></i> Acesso autorizado somente à Monitoria SESP-MT
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-titles">
                <h1 id="pageTitle">Dashboard Executivo</h1>
                <p id="pageSubtitle">Visão consolidada da carteira de contratos</p>
            </div>
            <div class="topbar-right">
                <div class="topbar-user">
                    <div class="topbar-avatar" id="topbarAvatar">SG</div>
                    <div>
                        <strong id="topbarUserName">Monitoria SGC</strong>
                        <small>Analista SESP-MT</small>
                    </div>
                </div>
                <button class="btn btn-primary" type="button" onclick="openHomePage()"><i data-lucide="home"></i> HOME</button>
            </div>
        </header>
        <div class="content-area" id="appContent"></div>
    </main>

    <script src="api-client.js"></script>
    <script>
        const dashboardState = {
            contratos: [],
            currentUser: null,
            lastView: 'dashboard'
        };

        function resolveFrontendPath(relativePath) {
            if ((window.location.hostname || '').toLowerCase().includes('vercel.app')) {
                return `/frontend/${String(relativePath || '').replace(/^\.?\/?/, '')}`;
            }
            return String(relativePath || '');
        }

        function refreshLucideIcons(container) {
            if (typeof lucide === 'undefined' || !lucide.createIcons) return;
            const root = (container && container.querySelector) ? container : document;
            lucide.createIcons({ root });
        }

        function openHomePage() {
            window.location.href = resolveFrontendPath('home.html.html');
        }

        function openContractsModule(numContrato) {
            if (numContrato) {
                sessionStorage.setItem('contractsDashboardTarget', String(numContrato));
            }
            window.location.href = resolveFrontendPath('contratos.html.html');
        }

        function getContractAttachmentUrl(contract) {
            const attachmentValue = String(contract?.arquivoContrato || '').trim();
            const contentValue = String(contract?.conteudoArquivoBase64 || '').trim();

            if (attachmentValue) {
                if (/^https?:\/\//i.test(attachmentValue) || /^data:/i.test(attachmentValue)) {
                    return attachmentValue;
                }

                const normalizedPath = attachmentValue.replace(/\\/g, '/').replace(/^\/+/, '');

                if (/^uploads\//i.test(normalizedPath)) {
                    return apiUrl(`/${encodeURI(normalizedPath)}`);
                }

                if (/^contracts\//i.test(normalizedPath)) {
                    return apiUrl(`/uploads/${encodeURI(normalizedPath)}`);
                }

                if (attachmentValue.startsWith('/')) {
                    return apiUrl(encodeURI(attachmentValue));
                }

                if (normalizedPath.includes('/')) {
                    return apiUrl(`/${encodeURI(normalizedPath)}`);
                }

                return apiUrl(`/uploads/contracts/${encodeURIComponent(normalizedPath)}`);
            }

            if (contentValue) {
                return `data:application/pdf;base64,${contentValue}`;
            }

            return '';
        }

        async function openContractPdf(numContrato) {
            const contract = dashboardState.contratos.find((item) => utils.getContractNumber(item) === String(numContrato || '').trim());
            const attachmentUrl = getContractAttachmentUrl(contract);
            if (!attachmentUrl) {
                alert('Este contrato não possui PDF/anexo cadastrado.');
                return;
            }

            if (!/^data:/i.test(attachmentUrl)) {
                try {
                    const response = await fetch(attachmentUrl, { method: 'HEAD', cache: 'no-store' });
                    if (!response.ok) {
                        alert('O PDF deste contrato não foi encontrado no servidor. Faça novo envio do anexo.');
                        return;
                    }
                } catch (error) {
                    // In network/CORS uncertainty, keep legacy behavior and try to open the document.
                }
            }

            window.open(attachmentUrl, '_blank', 'noopener,noreferrer');
        }

        const utils = {
            escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            },
            normalizeSearchText(value) {
                return String(value || '')
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9\s/]/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
            },
            getSearchableText(contract) {
                const contractObj = contract || {};
                const units = this.getUnitEntries(contractObj).map((entry) => this.getUnitName(entry)).filter(Boolean).join(' ');
                const lotes = (Array.isArray(contractObj.lotes) ? contractObj.lotes : [])
                    .map((lote) => `${String(lote?.lote || '')} ${String(lote?.descricao || '')}`).join(' ');
                const aditivos = (Array.isArray(contractObj.aditivos) ? contractObj.aditivos : [])
                    .flatMap((aditivo) => [String(aditivo?.numero || ''), String(aditivo?.numeroAditivo || ''), String(aditivo?.objeto || ''), String(aditivo?.descricao || '')]).join(' ');
                const empenhos = (Array.isArray(contractObj.empenhos) ? contractObj.empenhos : [])
                    .flatMap((e) => [String(e?.numero || ''), String(e?.numEmpenho || ''), String(e?.notaEmpenho || ''), String(e?.objeto || ''), String(e?.descricao || '')]).join(' ');
                return this.normalizeSearchText([
                    contractObj.numContrato,
                    contractObj.numProcesso,
                    contractObj.processo,
                    contractObj.credor,
                    contractObj.razaoSocial,
                    contractObj.nomeFantasia,
                    contractObj.nomeEmpresa,
                    contractObj.cnpj,
                    contractObj.objeto,
                    contractObj.cidade,
                    contractObj.bairro,
                    contractObj.logradouro,
                    contractObj.uf,
                    contractObj.status,
                    contractObj.emailEmpresa,
                    contractObj.telefoneFixo,
                    contractObj.telefoneWhatsapp,
                    units,
                    lotes,
                    aditivos,
                    empenhos
                ].join(' '));
            },
            getCompactDigits(value) {
                return String(value || '').replace(/\D/g, '');
            },
            parseMoney(value) {
                if (typeof value === 'number') return value;
                const text = String(value || '').trim();
                if (!text) return 0;
                const normalized = text.replace(/R\$/gi, '').replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
                return Number.parseFloat(normalized) || 0;
            },
            formatMoney(value) {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value || 0));
            },
            formatDate(dateStr) {
                if (!dateStr) return '-';
                const date = new Date(dateStr);
                if (Number.isNaN(date.getTime())) return String(dateStr);
                return date.toLocaleDateString('pt-BR');
            },
            getContractNumber(contract) {
                return String(contract?.numContrato || contract?.id || '-').trim();
            },
            getCompanyName(contract) {
                return String(contract?.nomeFantasia || contract?.razaoSocial || contract?.empresa || contract?.nomeEmpresa || contract?.razao_social || contract?.credor || '-').trim();
            },
            getContractObject(contract) {
                return String(contract?.objeto || '-').trim();
            },
            getContractProcess(contract) {
                return String(contract?.numProcesso || contract?.processo || '-').trim();
            },
            getContractValue(contract) {
                return this.parseMoney(contract?.valorGlobal || contract?.valor || 0);
            },
            getStartDate(contract) {
                return contract?.dtInicial || contract?.dataInicio || '';
            },
            getEndDate(contract) {
                return contract?.dtFinal || contract?.dataFim || '';
            },
            getValidDate(dateValue) {
                const date = new Date(dateValue || '');
                return Number.isNaN(date.getTime()) ? null : date;
            },
            calcDiasRestantes(contract) {
                const endDate = this.getValidDate(this.getEndDate(contract));
                if (!endDate) return null;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                endDate.setHours(0, 0, 0, 0);
                return Math.ceil((endDate.getTime() - today.getTime()) / 86400000);
            },
            calcProgressoData(contract) {
                const startDate = this.getValidDate(this.getStartDate(contract));
                const endDate = this.getValidDate(this.getEndDate(contract));
                if (!startDate || !endDate) return 0;
                const today = Date.now();
                const start = startDate.getTime();
                const end = endDate.getTime();
                if (today <= start) return 0;
                if (today >= end) return 100;
                return ((today - start) / (end - start)) * 100;
            },
            getStatus(contract) {
                const explicit = String(contract?.status || '').toLowerCase();
                if (explicit === 'encerrado' || explicit === 'inativo') return 'Encerrado';
                const dias = this.calcDiasRestantes(contract);
                if (dias !== null && dias < 0) return 'Encerrado';
                if (dias !== null && dias <= 90) return 'Vencendo';
                if (explicit === 'vencendo') return 'Vencendo';
                return 'Ativo';
            },
            getBadgeClass(status) {
                const normalized = String(status || '').toLowerCase();
                if (normalized === 'encerrado') return 'encerrado';
                if (normalized === 'vencendo') return 'vencendo';
                return 'ativo';
            },
            getUnitEntries(contract) {
                return Array.isArray(contract?.unidades) ? contract.unidades : [];
            },
            getUnitName(unitEntry) {
                return String(unitEntry?.unidade || unitEntry?.nome || unitEntry || '').trim();
            },
            getUnitAllocated(unitEntry, contract) {
                const value = this.parseMoney(unitEntry?.valor || unitEntry?.valorDestinado || 0);
                if (value > 0) return value;
                const entries = this.getUnitEntries(contract);
                if (entries.length === 1) return this.getContractValue(contract);
                return 0;
            },
            getUnitUsed(unitName, contract) {
                const empenhos = Array.isArray(contract?.empenhos) ? contract.empenhos : [];
                let total = 0;
                empenhos.forEach((empenho) => {
                    const units = Array.isArray(empenho?.unidades) ? empenho.unidades.map((item) => String(item || '').trim()) : [];
                    if (!units.includes(unitName)) return;
                    total += this.parseMoney(empenho?.valorEmpenho || 0) / Math.max(units.length, 1);
                });
                return total;
            },
            getGlobalUsed(contract) {
                return (Array.isArray(contract?.empenhos) ? contract.empenhos : []).reduce((sum, item) => sum + this.parseMoney(item?.valorEmpenho || 0), 0);
            },
            getAllUnitNames() {
                return Array.from(new Set(dashboardState.contratos.flatMap((contract) => this.getUnitEntries(contract).map((entry) => this.getUnitName(entry)).filter(Boolean)))).sort((a, b) => a.localeCompare(b));
            },
            aggregateGlobal() {
                let totalValue = 0;
                let totalUsed = 0;
                let active = 0;
                let critical = 0;

                dashboardState.contratos.forEach((contract) => {
                    totalValue += this.getContractValue(contract);
                    totalUsed += this.getGlobalUsed(contract);
                    const status = this.getStatus(contract);
                    if (status === 'Ativo') active += 1;
                    if (status === 'Vencendo') critical += 1;
                });

                return {
                    totalValue,
                    totalUsed,
                    totalContracts: dashboardState.contratos.length,
                    active,
                    critical
                };
            },
            groupUsageByUnit() {
                const usage = new Map();
                dashboardState.contratos.forEach((contract) => {
                    this.getUnitEntries(contract).forEach((entry) => {
                        const unitName = this.getUnitName(entry);
                        if (!unitName) return;
                        usage.set(unitName, (usage.get(unitName) || 0) + this.getUnitUsed(unitName, contract));
                    });
                });
                return Array.from(usage.entries()).sort((a, b) => b[1] - a[1]);
            },
            getAlerts() {
                return dashboardState.contratos
                    .map((contract) => ({ contract, dias: this.calcDiasRestantes(contract) }))
                    .filter((entry) => entry.dias !== null && entry.dias <= 90)
                    .sort((a, b) => a.dias - b.dias);
            },
            getUserDisplayName(user) {
                return String(user?.name || user?.nome || user?.email || 'Monitoria SGC').trim();
            },
            getUserInitials(user) {
                const parts = this.getUserDisplayName(user).split(/\s+/).filter(Boolean).slice(0, 2);
                return parts.map((part) => part.charAt(0).toUpperCase()).join('') || 'SG';
            },
            parseSmartDate(value) {
                if (!value) return null;
                const raw = String(value).trim();
                if (!raw) return null;

                const br = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if (br) {
                    const iso = `${br[3]}-${br[2]}-${br[1]}`;
                    const date = new Date(iso);
                    return Number.isNaN(date.getTime()) ? null : date;
                }

                const date = new Date(raw);
                return Number.isNaN(date.getTime()) ? null : date;
            },
            getLastUpdateLabel(contract) {
                const candidates = [];
                (Array.isArray(contract?.aditivos) ? contract.aditivos : []).forEach((item) => {
                    const date = this.parseSmartDate(item?.data);
                    if (date) candidates.push(date);
                });
                (Array.isArray(contract?.empenhos) ? contract.empenhos : []).forEach((item) => {
                    const date = this.parseSmartDate(item?.dataLancamento || item?.data || item?.dtEmpenho);
                    if (date) candidates.push(date);
                });
                if (!candidates.length) return '-';
                return candidates.sort((a, b) => b - a)[0].toLocaleDateString('pt-BR');
            },
            getContractDurationMonths(contract) {
                const start = this.getValidDate(this.getStartDate(contract));
                const end = this.getValidDate(this.getEndDate(contract));
                if (!start || !end || end < start) return '-';
                const totalMonths = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
                const safeMonths = Math.max(1, totalMonths + 1);
                return `${safeMonths} Meses`;
            },
            getAddressText(contract) {
                const parts = [
                    contract?.logradouro,
                    contract?.numEndereco,
                    contract?.bairro,
                    contract?.cidade,
                    contract?.uf,
                    contract?.cep
                ].map((item) => String(item || '').trim()).filter(Boolean);
                return parts.length ? parts.join(', ') : '-';
            },
            getContactText(contract) {
                const email = String(contract?.emailEmpresa || '').trim();
                const foneA = String(contract?.telefoneFixo || '').trim();
                const foneB = String(contract?.telefoneWhatsapp || '').trim();
                const phone = [foneA, foneB].filter(Boolean).join(' / ');
                if (!email && !phone) return '-';
                if (email && phone) return `${email} | ${phone}`;
                return email || phone;
            },
            getEmailText(contract) {
                return String(contract?.emailEmpresa || '').trim() || '-';
            },
            getPhoneText(contract) {
                const foneA = String(contract?.telefoneFixo || '').trim();
                const foneB = String(contract?.telefoneWhatsapp || '').trim();
                return [foneA, foneB].filter(Boolean).join(' / ') || '-';
            }
        };

        function getContractByNumber(numContrato) {

        async function fetchDashboardContractByNumber(numContrato) {
            const normalizedNumber = String(numContrato || '').trim();
            if (!normalizedNumber) return null;

            try {
                const data = await apiFetchJson(`/api/contracts?numContrato=${encodeURIComponent(normalizedNumber)}`);
                if (data && utils.getContractNumber(data)) {
                    const currentIndex = dashboardState.contratos.findIndex((contract) => utils.getContractNumber(contract) === utils.getContractNumber(data));
                    if (currentIndex >= 0) {
                        dashboardState.contratos[currentIndex] = data;
                    } else {
                        dashboardState.contratos.unshift(data);
                    }
                }
                return data;
            } catch (error) {
                console.error('Falha ao buscar detalhes do contrato no banco:', error);
                return getContractByNumber(normalizedNumber);
            }
        }

                refreshLucideIcons(this.content);
                const input = document.getElementById('searchInput');
                if (input) {
                    input.addEventListener('keypress', (event) => {
                        if (event.key === 'Enter') app.realizarBusca();
                    });
                }
                document.getElementById('searchInput').focus();
            },

            realizarBusca() {
                const input = document.getElementById('searchInput');
                const term = String(input?.value || '').trim().toLowerCase();
                const resultsContainer = document.getElementById('searchResults');
                const detailsPanel = document.getElementById('searchDetailsPanel');
                const detailsContent = document.getElementById('searchDetailsContent');
                if (!resultsContainer) return;
                if (!term) {
                    resultsContainer.innerHTML = '<div class="empty-state"><i data-lucide="search"></i><br>Informe um termo para pesquisar.</div>';
                    if (detailsPanel) detailsPanel.style.display = 'none';
                    if (detailsContent) detailsContent.innerHTML = '';
                    refreshLucideIcons(resultsContainer);
                    return;
                }

                const termNormalized = utils.normalizeSearchText(term);
                const termDigits = utils.getCompactDigits(termNormalized);
                const hasNumberCriteria = termDigits.length >= 8;
                const termTokens = termNormalized.split(' ').filter(Boolean);

                const resultados = dashboardState.contratos.filter((contract) => {
                    const searchable = utils.getSearchableText(contract);
                    if (hasNumberCriteria && termDigits.length >= 14) {
                        const contractCnpjDigits = utils.getCompactDigits(contract?.cnpj || '');
                        if (contractCnpjDigits.includes(termDigits)) return true;
                    }
                    if (hasNumberCriteria) {
                        const processDigits = utils.getCompactDigits([contract?.numContrato, contract?.numProcesso, contract?.processo].join(' '));
                        if (processDigits.includes(termDigits)) return true;
                    }
                    return termTokens.every((token) => searchable.includes(token));
                });
                if (!resultados.length) {
                    resultsContainer.innerHTML = '<div class="empty-state"><i data-lucide="search-x"></i><br>Nenhum contrato corresponde ao termo pesquisado.</div>';
                    if (detailsPanel) detailsPanel.style.display = 'none';
                    if (detailsContent) detailsContent.innerHTML = '';
                    refreshLucideIcons(resultsContainer);
                    return;
                }

                resultsContainer.innerHTML = `
                    <div style="margin-bottom:14px; color:var(--muted); font-size:13px; font-weight:600;"><i data-lucide="list-filter" style="width:14px;height:14px; color:var(--cyan); vertical-align:-2px;"></i> Resultados encontrados: <strong style="color:var(--cyan);">${resultados.length}</strong></div>
                    <div class="card">
                        <table>
                            <thead><tr><th>Contrato / Empresa</th><th>Objeto</th><th>Unidades</th><th>Status</th><th>Ação</th></tr></thead>
                            <tbody>
                                ${resultados.map((contract) => {
                                    const status = utils.getStatus(contract);
                                    const units = utils.getUnitEntries(contract).map((entry) => utils.getUnitName(entry)).filter(Boolean).join(', ');
                                    return `
                                        <tr>
                                            <td><strong style="color:#fff;">${utils.escapeHtml(utils.getContractNumber(contract))}</strong><br><span style="font-size:11px; color:var(--muted);">${utils.escapeHtml(utils.getCompanyName(contract))}</span></td>
                                            <td>${utils.escapeHtml(utils.getContractObject(contract))}</td>
                                            <td>${utils.escapeHtml(units || '-')}</td>
                                            <td><span class="badge ${utils.getBadgeClass(status)}"><i data-lucide="circle"></i> ${status}</span></td>
                                            <td><button class="btn btn-secondary" type="button" onclick="openDashboardContractDetails('${utils.escapeHtml(utils.getContractNumber(contract))}', 'busca')"><i data-lucide="eye"></i> Detalhamento</button></td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                refreshLucideIcons(resultsContainer);
            },

            async reloadData() {
                dashboardState.lastView = dashboardState.lastView || 'dashboard';
                this.content.innerHTML = '<div class="loading-state"><i data-lucide="loader-2"></i><br>Atualizando contratos cadastrados...</div>';
                refreshLucideIcons(this.content);
                try {
                    await loadDashboardContracts();
                    this.navigate(dashboardState.lastView);
                } catch (error) {
                    console.error('Falha ao atualizar dashboard:', error);
                    this.content.innerHTML = '<div class="empty-state"><i data-lucide="alert-triangle"></i><br>Não foi possível atualizar os contratos do dashboard agora.</div>';
                    refreshLucideIcons(this.content);
                }
            },

            async init() {
                this.content.innerHTML = '<div class="loading-state"><i data-lucide="loader-2"></i><br>Carregando dados dos contratos cadastrados...</div>';
                refreshLucideIcons(this.content);
                await loadCurrentUser();
                try {
                    await loadDashboardContracts();
                    this.navigate('dashboard');
                } catch (error) {
                    console.error('Falha ao carregar dashboard:', error);
                    this.content.innerHTML = '<div class="empty-state"><i data-lucide="alert-triangle"></i><br>Não foi possível carregar os contratos cadastrados para o dashboard.</div>';
                    refreshLucideIcons(this.content);
                }
            }
        };

        window.addEventListener('load', () => {
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
            app.init();
        });
    </script>
</body>
</html>
