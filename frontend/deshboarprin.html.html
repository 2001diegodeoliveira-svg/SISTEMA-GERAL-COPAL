<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SGC - Monitoria de Contratos | SESP-MT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-page: #0b132b;
            --bg-card: #1c2541;
            --bg-card-hover: #232d4c;
            --sidebar-bg: #070b19;
            --sidebar-hover: #1c2541;
            --brand-blue: #4ea8de;
            --brand-cyan: #38bdf8;
            --text-main: #e0fbfc;
            --text-muted: #8d99ae;
            --border-color: #2d3748;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            min-height: 100vh;
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background-color: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header i {
            font-size: 24px;
            color: var(--brand-blue);
        }

        .sidebar-header h2 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            color: #fff;
        }

        .sidebar-header span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .nav-menu {
            list-style: none;
            padding: 20px 0;
            flex: 1;
        }

        .nav-item {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover,
        .nav-item.active {
            background-color: var(--sidebar-hover);
            color: #fff;
            border-left: 4px solid var(--brand-blue);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            min-height: 70px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            gap: 16px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .content-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 32px;
            background-color: var(--bg-page);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-left: 4px solid var(--brand-blue);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .kpi-card.warning {
            border-left-color: var(--warning);
        }

        .kpi-card.success {
            border-left-color: var(--success);
        }

        .kpi-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .kpi-value {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.2);
        }

        td {
            padding: 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            color: var(--text-main);
        }

        tbody tr:hover {
            background-color: var(--bg-card-hover);
        }

        .progress-container {
            width: 100%;
            background-color: #2d3748;
            height: 6px;
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--brand-blue);
            border-radius: 4px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            gap: 12px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.ativo {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.vencendo {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge.encerrado {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .form-control {
            padding: 10px 14px;
            background: #0b132b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            outline: none;
            color: #fff;
        }

        .form-control:focus {
            border-color: var(--brand-blue);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--brand-blue);
            color: #0b132b;
        }

        .btn-primary:hover {
            background: var(--brand-cyan);
        }

        .btn-secondary {
            background: #2d3748;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #41516b;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .empty-state,
        .loading-state {
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            padding: 28px;
            text-align: center;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
        }

        .summary-note {
            color: var(--text-muted);
            font-size: 12px;
        }

        .contract-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .contract-details-block {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-word;
        }

        .details-scroll {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .contract-details-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-avatar {
            width: 35px;
            height: 35px;
            background: var(--brand-blue);
            color: #0b132b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        @media (max-width: 1100px) {
            body {
                display: block;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .topbar {
                padding: 16px 18px;
                align-items: flex-start;
                flex-direction: column;
            }

            .content-area {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved"></i>
            <div>
                <h2>SESP-MT</h2>
                <span>Monitoria de Contratos</span>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item" onclick="openHomePage()"><i class="fa-solid fa-house"></i> Painel</li>
            <li class="nav-item active" onclick="app.navigate('dashboard', this)"><i class="fa-solid fa-chart-pie"></i> Dashboard Executivo</li>
            <li class="nav-item" onclick="app.navigate('unidades', this)"><i class="fa-solid fa-building-shield"></i> Painel de Unidades</li>
            <li class="nav-item" onclick="app.navigate('contratos', this)"><i class="fa-solid fa-file-contract"></i> Painel de Contratos</li>
            <li class="nav-item" onclick="app.navigate('busca', this)"><i class="fa-solid fa-magnifying-glass"></i> Busca Inteligente</li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title" id="pageTitle">Dashboard Executivo</div>
            <div class="topbar-actions">
                <button class="btn btn-primary" type="button" onclick="openHomePage()"><i class="fa-solid fa-house"></i> HOME</button>
            </div>
        </header>
        <div class="content-area" id="appContent"></div>
    </main>

    <script src="api-client.js"></script>
    <script>
        const dashboardState = {
            contratos: [],
            currentUser: null,
            lastView: 'dashboard'
        };

        function resolveFrontendPath(relativePath) {
            if ((window.location.hostname || '').toLowerCase().includes('vercel.app')) {
                return `/frontend/${String(relativePath || '').replace(/^\.?\/?/, '')}`;
            }
            return String(relativePath || '');
        }

        function openHomePage() {
            window.location.href = resolveFrontendPath('home.html.html');
        }

        function openContractsModule(numContrato) {
            if (numContrato) {
                sessionStorage.setItem('contractsDashboardTarget', String(numContrato));
            }
            window.location.href = resolveFrontendPath('contratos.html.html');
        }

        function getContractAttachmentUrl(contract) {
            const attachmentValue = String(contract?.arquivoContrato || '').trim();
            const contentValue = String(contract?.conteudoArquivoBase64 || '').trim();

            if (attachmentValue) {
                if (/^https?:\/\//i.test(attachmentValue) || /^data:/i.test(attachmentValue)) {
                    return attachmentValue;
                }

                const normalizedPath = attachmentValue.replace(/\\/g, '/').replace(/^\/+/, '');

                if (/^uploads\//i.test(normalizedPath)) {
                    return apiUrl(`/${encodeURI(normalizedPath)}`);
                }

                if (/^contracts\//i.test(normalizedPath)) {
                    return apiUrl(`/uploads/${encodeURI(normalizedPath)}`);
                }

                if (attachmentValue.startsWith('/')) {
                    return apiUrl(encodeURI(attachmentValue));
                }

                if (normalizedPath.includes('/')) {
                    return apiUrl(`/${encodeURI(normalizedPath)}`);
                }

                return apiUrl(`/uploads/contracts/${encodeURIComponent(normalizedPath)}`);
            }

            if (contentValue) {
                return `data:application/pdf;base64,${contentValue}`;
            }

            return '';
        }

        async function openContractPdf(numContrato) {
            const contract = dashboardState.contratos.find((item) => utils.getContractNumber(item) === String(numContrato || '').trim());
            const attachmentUrl = getContractAttachmentUrl(contract);
            if (!attachmentUrl) {
                alert('Este contrato não possui PDF/anexo cadastrado.');
                return;
            }

            if (!/^data:/i.test(attachmentUrl)) {
                try {
                    const response = await fetch(attachmentUrl, { method: 'HEAD', cache: 'no-store' });
                    if (!response.ok) {
                        alert('O PDF deste contrato não foi encontrado no servidor. Faça novo envio do anexo.');
                        return;
                    }
                } catch (error) {
                    // In network/CORS uncertainty, keep legacy behavior and try to open the document.
                }
            }

            window.open(attachmentUrl, '_blank', 'noopener,noreferrer');
        }

        const utils = {
            escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            },
            parseMoney(value) {
                if (typeof value === 'number') return value;
                const text = String(value || '').trim();
                if (!text) return 0;
                const normalized = text.replace(/R\$/gi, '').replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
                return Number.parseFloat(normalized) || 0;
            },
            formatMoney(value) {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value || 0));
            },
            formatDate(dateStr) {
                if (!dateStr) return '-';
                const date = new Date(dateStr);
                if (Number.isNaN(date.getTime())) return String(dateStr);
                return date.toLocaleDateString('pt-BR');
            },
            getContractNumber(contract) {
                return String(contract?.numContrato || contract?.id || '-').trim();
            },
            getCompanyName(contract) {
                return String(contract?.nomeFantasia || contract?.razaoSocial || contract?.empresa || contract?.nomeEmpresa || contract?.razao_social || contract?.credor || '-').trim();
            },
            getContractObject(contract) {
                return String(contract?.objeto || '-').trim();
            },
            getContractProcess(contract) {
                return String(contract?.numProcesso || contract?.processo || '-').trim();
            },
            getContractValue(contract) {
                return this.parseMoney(contract?.valorGlobal || contract?.valor || 0);
            },
            getStartDate(contract) {
                return contract?.dtInicial || contract?.dataInicio || '';
            },
            getEndDate(contract) {
                return contract?.dtFinal || contract?.dataFim || '';
            },
            getValidDate(dateValue) {
                const date = new Date(dateValue || '');
                return Number.isNaN(date.getTime()) ? null : date;
            },
            calcDiasRestantes(contract) {
                const endDate = this.getValidDate(this.getEndDate(contract));
                if (!endDate) return null;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                endDate.setHours(0, 0, 0, 0);
                return Math.ceil((endDate.getTime() - today.getTime()) / 86400000);
            },
            calcProgressoData(contract) {
                const startDate = this.getValidDate(this.getStartDate(contract));
                const endDate = this.getValidDate(this.getEndDate(contract));
                if (!startDate || !endDate) return 0;
                const today = Date.now();
                const start = startDate.getTime();
                const end = endDate.getTime();
                if (today <= start) return 0;
                if (today >= end) return 100;
                return ((today - start) / (end - start)) * 100;
            },
            getStatus(contract) {
                const explicit = String(contract?.status || '').toLowerCase();
                if (explicit === 'encerrado' || explicit === 'inativo') return 'Encerrado';
                const dias = this.calcDiasRestantes(contract);
                if (dias !== null && dias < 0) return 'Encerrado';
                if (dias !== null && dias <= 90) return 'Vencendo';
                if (explicit === 'vencendo') return 'Vencendo';
                return 'Ativo';
            },
            getBadgeClass(status) {
                const normalized = String(status || '').toLowerCase();
                if (normalized === 'encerrado') return 'encerrado';
                if (normalized === 'vencendo') return 'vencendo';
                return 'ativo';
            },
            getUnitEntries(contract) {
                return Array.isArray(contract?.unidades) ? contract.unidades : [];
            },
            getUnitName(unitEntry) {
                return String(unitEntry?.unidade || unitEntry?.nome || unitEntry || '').trim();
            },
            getUnitAllocated(unitEntry, contract) {
                const value = this.parseMoney(unitEntry?.valor || unitEntry?.valorDestinado || 0);
                if (value > 0) return value;
                const entries = this.getUnitEntries(contract);
                if (entries.length === 1) return this.getContractValue(contract);
                return 0;
            },
            getUnitUsed(unitName, contract) {
                const empenhos = Array.isArray(contract?.empenhos) ? contract.empenhos : [];
                let total = 0;
                empenhos.forEach((empenho) => {
                    const units = Array.isArray(empenho?.unidades) ? empenho.unidades.map((item) => String(item || '').trim()) : [];
                    if (!units.includes(unitName)) return;
                    total += this.parseMoney(empenho?.valorEmpenho || 0) / Math.max(units.length, 1);
                });
                return total;
            },
            getGlobalUsed(contract) {
                return (Array.isArray(contract?.empenhos) ? contract.empenhos : []).reduce((sum, item) => sum + this.parseMoney(item?.valorEmpenho || 0), 0);
            },
            getAllUnitNames() {
                return Array.from(new Set(dashboardState.contratos.flatMap((contract) => this.getUnitEntries(contract).map((entry) => this.getUnitName(entry)).filter(Boolean)))).sort((a, b) => a.localeCompare(b));
            },
            aggregateGlobal() {
                let totalValue = 0;
                let totalUsed = 0;
                let active = 0;
                let critical = 0;

                dashboardState.contratos.forEach((contract) => {
                    totalValue += this.getContractValue(contract);
                    totalUsed += this.getGlobalUsed(contract);
                    const status = this.getStatus(contract);
                    if (status === 'Ativo') active += 1;
                    if (status === 'Vencendo') critical += 1;
                });

                return {
                    totalValue,
                    totalUsed,
                    totalContracts: dashboardState.contratos.length,
                    active,
                    critical
                };
            },
            groupUsageByUnit() {
                const usage = new Map();
                dashboardState.contratos.forEach((contract) => {
                    this.getUnitEntries(contract).forEach((entry) => {
                        const unitName = this.getUnitName(entry);
                        if (!unitName) return;
                        usage.set(unitName, (usage.get(unitName) || 0) + this.getUnitUsed(unitName, contract));
                    });
                });
                return Array.from(usage.entries()).sort((a, b) => b[1] - a[1]);
            },
            getAlerts() {
                return dashboardState.contratos
                    .map((contract) => ({ contract, dias: this.calcDiasRestantes(contract) }))
                    .filter((entry) => entry.dias !== null && entry.dias <= 90)
                    .sort((a, b) => a.dias - b.dias);
            },
            getUserDisplayName(user) {
                return String(user?.name || user?.nome || user?.email || 'Monitoria SGC').trim();
            },
            getUserInitials(user) {
                const parts = this.getUserDisplayName(user).split(/\s+/).filter(Boolean).slice(0, 2);
                return parts.map((part) => part.charAt(0).toUpperCase()).join('') || 'SG';
            },
            parseSmartDate(value) {
                if (!value) return null;
                const raw = String(value).trim();
                if (!raw) return null;

                const br = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if (br) {
                    const iso = `${br[3]}-${br[2]}-${br[1]}`;
                    const date = new Date(iso);
                    return Number.isNaN(date.getTime()) ? null : date;
                }

                const date = new Date(raw);
                return Number.isNaN(date.getTime()) ? null : date;
            },
            getLastUpdateLabel(contract) {
                const candidates = [];
                (Array.isArray(contract?.aditivos) ? contract.aditivos : []).forEach((item) => {
                    const date = this.parseSmartDate(item?.data);
                    if (date) candidates.push(date);
                });
                (Array.isArray(contract?.empenhos) ? contract.empenhos : []).forEach((item) => {
                    const date = this.parseSmartDate(item?.dataLancamento || item?.data || item?.dtEmpenho);
                    if (date) candidates.push(date);
                });
                if (!candidates.length) return '-';
                return candidates.sort((a, b) => b - a)[0].toLocaleDateString('pt-BR');
            },
            getContractDurationMonths(contract) {
                const start = this.getValidDate(this.getStartDate(contract));
                const end = this.getValidDate(this.getEndDate(contract));
                if (!start || !end || end < start) return '-';
                const totalMonths = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
                const safeMonths = Math.max(1, totalMonths + 1);
                return `${safeMonths} Meses`;
            },
            getAddressText(contract) {
                const parts = [
                    contract?.logradouro,
                    contract?.numEndereco,
                    contract?.bairro,
                    contract?.cidade,
                    contract?.uf,
                    contract?.cep
                ].map((item) => String(item || '').trim()).filter(Boolean);
                return parts.length ? parts.join(', ') : '-';
            },
            getContactText(contract) {
                const email = String(contract?.emailEmpresa || '').trim();
                const foneA = String(contract?.telefoneFixo || '').trim();
                const foneB = String(contract?.telefoneWhatsapp || '').trim();
                const phone = [foneA, foneB].filter(Boolean).join(' / ');
                if (!email && !phone) return '-';
                if (email && phone) return `${email} | ${phone}`;
                return email || phone;
            },
            getEmailText(contract) {
                return String(contract?.emailEmpresa || '').trim() || '-';
            },
            getPhoneText(contract) {
                const foneA = String(contract?.telefoneFixo || '').trim();
                const foneB = String(contract?.telefoneWhatsapp || '').trim();
                return [foneA, foneB].filter(Boolean).join(' / ') || '-';
            }
        };

        function getContractByNumber(numContrato) {
            const target = String(numContrato || '').trim().toLowerCase();
            return dashboardState.contratos.find((contract) => utils.getContractNumber(contract).toLowerCase() === target) || null;
        }

        async function fetchDashboardContractByNumber(numContrato) {
            const normalizedNumber = String(numContrato || '').trim();
            if (!normalizedNumber) return null;

            try {
                const data = await apiFetchJson(`/api/contracts?numContrato=${encodeURIComponent(normalizedNumber)}`);
                if (data && utils.getContractNumber(data)) {
                    const currentIndex = dashboardState.contratos.findIndex((contract) => utils.getContractNumber(contract) === utils.getContractNumber(data));
                    if (currentIndex >= 0) {
                        dashboardState.contratos[currentIndex] = data;
                    } else {
                        dashboardState.contratos.unshift(data);
                    }
                }
                return data;
            } catch (error) {
                console.error('Falha ao buscar detalhes do contrato no banco:', error);
                return getContractByNumber(normalizedNumber);
            }
        }

        function getContractDetailsElements(view) {
            const safeView = view === 'busca' ? 'busca' : 'contratos';
            return {
                panel: document.getElementById(safeView === 'busca' ? 'searchDetailsPanel' : 'contratosDetailsPanel'),
                content: document.getElementById(safeView === 'busca' ? 'searchDetailsContent' : 'contratosDetailsContent')
            };
        }

        async function openDashboardContractDetails(numContrato, view = 'contratos') {
            const normalizedNumber = String(numContrato || '').trim();
            if (!normalizedNumber) return;

            if (view && dashboardState.lastView !== view) {
                app.navigate(view);
            }

            if (view === 'contratos' && !document.getElementById('contratosDetailsPanel')) {
                app.renderContratos();
            }
            if (view === 'busca' && !document.getElementById('searchDetailsPanel')) {
                app.renderBusca();
            }

            const contract = await fetchDashboardContractByNumber(normalizedNumber);
            renderContractDetailsInDashboard(contract, view);
        }

        function renderContractDetailsInDashboard(contract, view = 'contratos') {
            const { panel: detailsPanel, content: detailsContent } = getContractDetailsElements(view);
            if (!detailsPanel || !detailsContent) return;

            if (!contract) {
                detailsPanel.style.display = 'none';
                detailsContent.innerHTML = '';
                return;
            }

            const attachmentUrl = getContractAttachmentUrl(contract);
            const attachmentLabel = String(contract?.arquivoContrato || '').split('/').pop() || 'Visualizar PDF';
            const lotes = Array.isArray(contract?.lotes) ? contract.lotes : [];
            const unidades = utils.getUnitEntries(contract).map((entry) => utils.getUnitName(entry)).filter(Boolean);
            const aditivos = Array.isArray(contract?.aditivos) ? contract.aditivos : [];
            const empenhos = Array.isArray(contract?.empenhos) ? contract.empenhos : [];
            const totalValue = utils.getContractValue(contract);
            const usedValue = utils.getGlobalUsed(contract);
            const availableValue = Math.max(totalValue - usedValue, 0);

            detailsContent.innerHTML = `
                <div class="contract-details-grid">
                    <div class="contract-details-block"><strong>Contrato:</strong> ${utils.escapeHtml(utils.getContractNumber(contract))}</div>
                    <div class="contract-details-block"><strong>Processo:</strong> ${utils.escapeHtml(utils.getContractProcess(contract))}</div>
                    <div class="contract-details-block"><strong>Status:</strong> ${utils.escapeHtml(utils.getStatus(contract))}</div>
                    <div class="contract-details-block"><strong>Credor:</strong> ${utils.escapeHtml(String(contract?.credor || '-'))}</div>
                    <div class="contract-details-block"><strong>Nome da Contratada:</strong> ${utils.escapeHtml(utils.getCompanyName(contract))}</div>
                    <div class="contract-details-block"><strong>Endereço:</strong> ${utils.escapeHtml(utils.getAddressText(contract))}</div>
                    <div class="contract-details-block"><strong>Endereço Eletrônico:</strong> ${utils.escapeHtml(utils.getEmailText(contract))}</div>
                    <div class="contract-details-block"><strong>Telefone:</strong> ${utils.escapeHtml(utils.getPhoneText(contract))}</div>
                    <div class="contract-details-block"><strong>Vigência:</strong> ${utils.escapeHtml(utils.getContractDurationMonths(contract))}</div>
                    <div class="contract-details-block"><strong>Prazo de vigência:</strong> ${utils.escapeHtml(utils.formatDate(utils.getStartDate(contract)))} até ${utils.escapeHtml(utils.formatDate(utils.getEndDate(contract)))}</div>
                    <div class="contract-details-block"><strong>Tipo de entrega:</strong> ${utils.escapeHtml(String(contract?.tipoEntrega || '-'))}</div>
                    <div class="contract-details-block"><strong>Prazo de entrega:</strong> ${utils.escapeHtml(String(contract?.prazoEntrega || '-'))}</div>
                </div>

                <div class="contract-details-block" style="margin-bottom: 12px;"><strong>Objeto:</strong> ${utils.escapeHtml(utils.getContractObject(contract))}</div>

                <div class="contract-details-grid">
                    <div class="contract-details-block"><strong>Valor total:</strong> ${utils.escapeHtml(utils.formatMoney(totalValue))}</div>
                    <div class="contract-details-block"><strong>Valor usado:</strong> ${utils.escapeHtml(utils.formatMoney(usedValue))}</div>
                    <div class="contract-details-block"><strong>Saldo disponível:</strong> ${utils.escapeHtml(utils.formatMoney(availableValue))}</div>
                </div>

                <div class="contract-details-grid">
                    <div class="contract-details-block"><strong>Lotes:</strong> ${lotes.length}</div>
                    <div class="contract-details-block"><strong>Unidades:</strong> ${unidades.length}</div>
                    <div class="contract-details-block"><strong>Aditivos:</strong> ${aditivos.length}</div>
                    <div class="contract-details-block"><strong>Empenhos:</strong> ${empenhos.length}</div>
                </div>

                <div class="contract-details-block" style="margin-bottom: 12px;">
                    <strong>Documentos anexados:</strong><br>
                    ${attachmentUrl ? `<a href="${attachmentUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--brand-cyan); font-weight: 600;">Visualizar PDF ${utils.escapeHtml(attachmentLabel)}</a>` : 'Sem anexo cadastrado'}
                </div>

                <div class="contract-details-title">Lotes cadastrados</div>
                <div class="contract-details-block" style="margin-bottom: 12px;">
                    ${lotes.length ? lotes.map((lote) => `${utils.escapeHtml(String(lote?.lote || 'Lote'))}${lote?.descricao ? ` - ${utils.escapeHtml(String(lote.descricao))}` : ''}`).join('<br>') : 'Nenhum lote cadastrado.'}

                <div class="contract-details-block" style="margin-bottom: 12px;">${unidades.length ? utils.escapeHtml(unidades.join(' / ')) : 'Nenhuma unidade vinculada.'}</div>

                <div class="contract-details-block"><strong>Última atualização:</strong> ${utils.escapeHtml(utils.getLastUpdateLabel(contract))}</div>

        function updateTopbarUser() {
            const avatar = document.getElementById('topbarAvatar');
            const label = document.getElementById('topbarUserName');
            if (!avatar || !label) return;
            avatar.innerText = utils.getUserInitials(dashboardState.currentUser);
            label.innerText = dashboardState.currentUser ? utils.getUserDisplayName(dashboardState.currentUser) : 'Monitoria SGC';
        }

        async function loadDashboardContracts() {
            const data = await apiFetchJson('/api/contracts');
            dashboardState.contratos = Array.isArray(data?.contracts) ? data.contracts : [];
        }

        async function loadCurrentUser() {
            const token = localStorage.getItem('accessToken') || '';
            if (!token) {
                dashboardState.currentUser = null;
                updateTopbarUser();
                return;
            }

            try {
                const data = await apiFetchJson('/auth/me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                dashboardState.currentUser = data?.user || null;
            } catch (error) {
                dashboardState.currentUser = null;
            }
            updateTopbarUser();
        }

                    element.classList.add('active');

                }
                const order = ['dashboard', 'unidades', 'contratos', 'busca'];
                const index = order.indexOf(view);

                if (nav) nav.classList.add('active');

                            <table style="background: rgba(245, 158, 11, 0.05); border-radius: 8px; overflow: hidden;">

                setTimeout(() => {

                    Chart.defaults.borderColor = '#2D3748';

                    const chartUnits = document.getElementById('chartOrgaos');
                    if (chartUnits) {
                        this.charts.push(new Chart(chartUnits, {
                            type: 'bar',

                            type: 'doughnut',

                                labels: ['Ativos', 'Vencendo', 'Encerrados'],

                                    backgroundColor: ['#10B981', '#F59E0B', '#EF4444'],
                                    borderWidth: 0

                                responsive: true,
                                maintainAspectRatio: false,

                let totalDestinado = 0;
                let totalUtilizado = 0;
                const contratosDaUnidade = dashboardState.contratos.filter((contract) => {
                    const entry = utils.getUnitEntries(contract).find((item) => utils.getUnitName(item) === selectedUnit);

                    totalDestinado += utils.getUnitAllocated(entry, contract);
                    totalUtilizado += utils.getUnitUsed(selectedUnit, contract);
                    return true;
                });

                this.content.innerHTML = `
                    <div class="card">
                        <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                            <h3 style="white-space: nowrap; font-size: 14px; color: var(--text-muted);">SELECIONE A UNIDADE:</h3>
                            <select class="form-control" style="max-width: 320px; font-weight: bold;" onchange="app.renderUnidades(this.value)">
                                ${units.map((unit) => `<option value="${utils.escapeHtml(unit)}" ${unit === selectedUnit ? 'selected' : ''}>${utils.escapeHtml(unit)}</option>`).join('')}

                    <div class="kpi-grid">

                        <div class="kpi-card success"><span class="kpi-title">Saldo Financeiro Unidade</span><span class="kpi-value">${utils.formatMoney(Math.max(totalDestinado - totalUtilizado, 0))}</span></div>
                        <div class="kpi-card"><span class="kpi-title">Contratos Vinculados</span><span class="kpi-value">${contratosDaUnidade.length}</span><span class="summary-note">Com base nos vínculos do cadastro inicial.</span></div>
                    </div>

                    <div class="card">
                        <div class="card-header"><div class="card-title">Contratos Vinculados - ${utils.escapeHtml(selectedUnit)}</div></div>
                        ${contratosDaUnidade.length ? `
                            <table>
                                <thead>
                                    <tr>
                                        <th>Contrato / Empresa</th>

                                </thead>
                                <tbody>
                                    ${contratosDaUnidade.map((contract) => {

                                        const percent = allocated > 0 ? (used / allocated) * 100 : 0;
                                        return `
                                            <tr>
                                                <td><strong>${utils.escapeHtml(utils.getContractNumber(contract))}</strong><br><span style="font-size: 11px; color: var(--text-muted)">${utils.escapeHtml(utils.getCompanyName(contract))}</span></td>
                                                <td><div style="max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${utils.escapeHtml(utils.getContractObject(contract))}">${utils.escapeHtml(utils.getContractObject(contract))}</div></td>

            realizarBusca() {

                    if (detailsContent) detailsContent.innerHTML = '';

                                            <td>${utils.escapeHtml(utils.getContractObject(contract))}</td>
                                            <td>${utils.escapeHtml(units || '-')}</td>
                                            <td><span class="badge ${utils.getBadgeClass(status)}">${status}</span></td>
                                            <td><button class="btn btn-secondary" type="button" onclick="openDashboardContractDetails('${utils.escapeHtml(utils.getContractNumber(contract))}', 'busca')">Detalhamento</button></td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            },

            async reloadData() {
                this.content.innerHTML = '<div class="loading-state">Atualizando contratos cadastrados...</div>';
                try {
                    await loadDashboardContracts();
                    this.navigate(dashboardState.lastView || 'dashboard');
                } catch (error) {
                    console.error('Falha ao atualizar dashboard:', error);
                    this.renderEmpty('Não foi possível atualizar os contratos do dashboard agora.');
                }
            },

            async init() {
                this.content.innerHTML = '<div class="loading-state">Carregando dados dos contratos cadastrados...</div>';
                await loadCurrentUser();
                try {
                    await loadDashboardContracts();
                    this.navigate('dashboard');
                } catch (error) {
                    console.error('Falha ao carregar dashboard:', error);
                    this.renderEmpty('Não foi possível carregar os contratos cadastrados para o dashboard.');
                }
            }
        };

        window.addEventListener('load', () => {
            app.init();
        });
    </script>
</body>
</html>
