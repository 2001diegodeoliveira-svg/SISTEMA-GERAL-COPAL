<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Autenticação com OTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Oculta as setas de input number no Chrome/Safari/Firefox */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>
</head>
<body id="bgContainer" class="bg-slate-900 text-white min-h-screen flex items-center justify-center bg-cover bg-center transition-all duration-500" style="background-image: url('imagens/imagem.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
  <div class="absolute inset-0 bg-black/10"></div>

  <div class="relative z-20 text-center">
    <button id="openLoginBtn" class="px-6 py-3 mt-6 bg-indigo-600/90 hover:bg-indigo-700 text-white font-semibold rounded-full shadow-2xl shadow-indigo-500/30 transition">
      LOGIN NO SISTEMA
    </button>
  </div>

  <div id="loginWrapper" class="relative z-10 w-full max-w-md p-8 bg-slate-800/90 rounded-2xl shadow-2xl border border-slate-700 hidden">
    <!-- Caixas de Alerta -->
    <div id="alertBox" class="hidden p-4 mb-4 text-sm rounded-lg transition-all" role="alert"></div>

    <!-- VIEW 1: LOGIN -->
    <div id="loginView">
      <h2 class="text-3xl font-bold mb-2 text-center text-indigo-400">Entrar na Conta</h2>
      <p class="text-sm text-slate-400 text-center mb-6">Autenticação segura via E-mail</p>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="loginEmail" class="block text-sm font-medium mb-1 text-slate-300">E-mail ou login</label>
          <input type="text" id="loginEmail" required placeholder="DEVHenrique ou Copal Adm" class="w-full px-4 py-2 bg-slate-700/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
        </div>
        <div>
          <label for="loginPassword" class="block text-sm font-medium mb-1 text-slate-300">Senha</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2 bg-slate-700/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold transition duration-200 text-white shadow-lg shadow-indigo-500/30">
          Entrar
        </button>
      </form>
      <p class="mt-4 text-center text-sm text-slate-400">
        Não tem conta? <a href="#" onclick="switchView('registerView')" class="text-indigo-400 hover:underline">Cadastre-se</a>
      </p>
    </div>

    <!-- VIEW 2: REGISTRO -->
    <div id="registerView" class="hidden">
      <h2 class="text-3xl font-bold mb-2 text-center text-indigo-400">Criar Conta</h2>
      <p class="text-sm text-slate-400 text-center mb-6">Insira seus dados para receber o código</p>
      
      <form id="registerForm" class="space-y-4">
        <div>
          <label for="regEmail" class="block text-sm font-medium mb-1 text-slate-300">E-mail</label>
          <input type="email" id="regEmail" required placeholder="seu@email.com" class="w-full px-4 py-2 bg-slate-700/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
        </div>
        <div>
          <label for="regPassword" class="block text-sm font-medium mb-1 text-slate-300">Senha</label>
          <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-2 bg-slate-700/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold transition duration-200 text-white shadow-lg shadow-indigo-500/30">
          Cadastrar
        </button>
      </form>
      <p class="mt-4 text-center text-sm text-slate-400">
        Já possui conta? <a href="#" onclick="switchView('loginView')" class="text-indigo-400 hover:underline">Fazer Login</a>
      </p>
    </div>

    <!-- VIEW 3: VERIFICAÇÃO OTP (CÓDIGO DE 6 DÍGITOS) -->
    <div id="verifyView" class="hidden">
      <h2 class="text-2xl font-bold mb-2 text-center text-emerald-400">Digite o Código</h2>
      <p class="text-sm text-slate-400 text-center mb-6">Enviamos um código de 6 dígitos para o seu e-mail.</p>
      
      <form id="otpForm" class="space-y-6">
        <!-- Campos numéricos individuais para UX de OTP -->
        <div class="flex justify-center gap-2" id="otpInputsContainer">
          <input type="number" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-700/90 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
          <input type="number" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-700/90 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
          <input type="number" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-700/90 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
          <input type="number" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-700/90 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
          <input type="number" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-700/90 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
          <input type="number" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-700/90 border border-slate-600 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
        </div>

        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 rounded-lg font-semibold transition duration-200 text-white shadow-lg shadow-emerald-500/30">
          Verificar Código
        </button>
      </form>

      <div class="mt-4 text-center">
        <button type="button" onclick="resendOtpCode()" class="text-sm text-slate-400 hover:text-emerald-400 underline transition">
          Reenviar novo código
        </button>
      </div>
    </div>

    <!-- VIEW 4: DASHBOARD -->
    <div id="dashboardView" class="hidden space-y-6">
      <div class="text-center">
        <h2 class="text-2xl font-bold text-indigo-400">Painel de Acesso</h2>
        <p id="userEmailDisplay" class="text-sm text-slate-300 font-mono mt-1 break-all"></p>
      </div>

      <div class="border-t border-slate-700 pt-5">
        <label for="bgInput" class="block text-sm font-medium mb-2 text-slate-300">Alterar Imagem de Fundo:</label>
        <input type="file" id="bgInput" accept="image/png, image/jpeg, image/webp" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer file:transition">
      </div>

      <button onclick="logout()" class="w-full py-2.5 bg-red-600/80 hover:bg-red-700 rounded-lg font-semibold transition text-white">
        Sair da Conta
      </button>
    </div>

  </div>

  <script>
    let accessToken = localStorage.getItem('accessToken');
    let currentPendingEmail = '';

    function showAlert(msg, isError = false) {
      const alert = document.getElementById('alertBox');
      alert.className = `p-4 mb-4 text-sm rounded-lg ${isError ? 'bg-red-900/80 border border-red-700 text-red-200' : 'bg-emerald-900/80 border border-emerald-700 text-emerald-200'}`;
      alert.innerText = msg;
      alert.classList.remove('hidden');
    }

    function switchView(viewId) {
      ['loginView', 'registerView', 'verifyView', 'dashboardView'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
      document.getElementById('alertBox').classList.add('hidden');
    }

    function setBackground(url) {
      if (url) {
        document.getElementById('bgContainer').style.backgroundImage = `url('${url}')`;
      }
    }

    function ensureServerMode() {
      // A verificação de protocolo foi removida para permitir abrir a página diretamente via file://.
      return true;
    }

    function showLoginPanel() {
      document.getElementById('openLoginBtn').classList.add('hidden');
      document.getElementById('loginWrapper').classList.remove('hidden');
      document.getElementById('loginEmail').focus();
    }

    document.getElementById('openLoginBtn').addEventListener('click', showLoginPanel);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.getElementById('loginWrapper').classList.contains('hidden')) {
        e.preventDefault();
        showLoginPanel();
      }
    });

    async function loadCurrentUser() {
      if (!accessToken) return;

      try {
        const res = await fetch('/auth/me', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (!res.ok) {
          localStorage.removeItem('accessToken');
          localStorage.removeItem('userRole');
          accessToken = null;
          return;
        }
        const data = await res.json();
        if (data && data.user) {
          currentPendingEmail = data.user.email || currentPendingEmail;
          document.getElementById('userEmailDisplay').textContent = data.user.email || '';
          if (data.user.backgroundImage) {
            setBackground(data.user.backgroundImage);
          }
          localStorage.setItem('userRole', data.user.role || 'user');
          window.location.href = 'home.html.html';
        }
      } catch (err) {
        console.error('Erro ao carregar usuário atual:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadCurrentUser();
      if (!accessToken) {
        showLoginPanel();
      }
    });

    // Configuração de Autofoco e Pulo dos Caixas de OTP
    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
    });

    function getOtpValue() {
      let code = '';
      otpInputs.forEach(i => code += i.value);
      return code;
    }

    // 1. Registro
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      currentPendingEmail = document.getElementById('regEmail').value;

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: currentPendingEmail,
            password: document.getElementById('regPassword').value
          })
        });

        const data = await res.json();
        
        if (res.ok) {
          showAlert(data.message + (data.devOtpCode ? ` [DEV CÓDIGO: ${data.devOtpCode}]` : ''));
          setTimeout(() => {
            switchView('verifyView');
            otpInputs[0].focus();
          }, 1500);
        } else {
          showAlert(Array.isArray(data.message) ? data.message.join(', ') : data.message, true);
        }
      } catch (err) {
        showAlert('Erro de conexão ao servidor.', true);
      }
    };

    // 2. Validação do Código OTP
    document.getElementById('otpForm').onsubmit = async (e) => {
      e.preventDefault();
      const code = getOtpValue();

      if (code.length !== 6) {
        showAlert('Por favor, digite os 6 dígitos do código.', true);
        return;
      }

      try {
        const res = await fetch('/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentPendingEmail, code })
        });
        const data = await res.json();

        if (res.ok) {
          showAlert(data.message);
          setTimeout(() => switchView('loginView'), 1500);
        } else {
          showAlert(data.message, true);
        }
      } catch (err) {
        showAlert('Erro ao verificar código OTP.', true);
      }
    };

    // 3. Reenviar Código
    async function resendOtpCode() {
      if (!currentPendingEmail) {
        showAlert('Informe o e-mail no formulário de registro.', true);
        return;
      }

      try {
        const res = await fetch('/auth/resend-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentPendingEmail })
        });
        const data = await res.json();
        showAlert(data.message + (data.devOtpCode ? ` [NOVO DEV CÓDIGO: ${data.devOtpCode}]` : ''));
      } catch (err) {
        showAlert('Erro ao solicitar novo código.', true);
      }
    }

    // 4. Login
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.message || 'Credenciais inválidas.', true);
          return;
        }

        accessToken = data.accessToken;
        localStorage.setItem('accessToken', accessToken);
        localStorage.setItem('userRole', data.user.role || 'user');
        localStorage.setItem('userEmail', data.user.email || '');

        showAlert('Login realizado com sucesso. Redirecionando...');
        setTimeout(() => {
          window.location.href = 'home.html.html';
        }, 800);
      } catch (err) {
        console.error(err);
        showAlert('Erro de conexão ao servidor.', true);
      }
    };

    // 5. Upload de Imagem de Fundo
    document.getElementById('bgInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/auth/upload-background', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${accessToken}` },
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          setBackground(data.backgroundImage);
          showAlert('Imagem de fundo alterada com sucesso!');
        } else {
          showAlert(data.message || 'Erro ao enviar a imagem.', true);
        }
      } catch (err) {
        showAlert('Erro no envio do arquivo.', true);
      }
    };

    function logout() {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('userRole');
      location.reload();
    }
  </script>
</body>
</html>
